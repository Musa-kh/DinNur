<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="styles/basicST.css">
    <link rel="stylesheet" href="styles/partnerST.css">
    <title data-key="title_partner">DinNur - Стать партнером</title>
</head>
<body class="theme-new partner-page">
    <main class="partner-main">
        <div class="video-container">
            <video autoplay muted loop playsinline class="partner-video">
                <source src="assets/video/WIN_20260704_14_25_38_Pro.mp4" type="video/mp4">
                <span data-key="no_video">Ваш браузер не поддерживает видео.</span>
            </video>
        </div>
        
        <div class="partner-actions">
            <a href="index.html" class="back-btn" data-key="back">Назад</a>
            <button type="button" class="become-partner-btn" id="openPartnerModal" data-key="partner">Стать партнером</button>
        </div>
    </main>

    <script src="scripts/scrolLang.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const openBtn = document.getElementById('openPartnerModal');
            
            openBtn.onclick = async () => {
                const currentLang = localStorage.getItem('selectedLanguage') || 'ru';
                
                let data = translationsCache[currentLang];
                if (!data) {
                    try {
                        const response = await fetch(`./languages/${currentLang}.json`);
                        data = await response.json();
                    } catch (e) {
                        console.error(e);
                        data = {};
                    }
                }

                let message = data['whatsapp_message'] || "Здравствуйте 🤝☺️\nМожно по подробнее про заработок в Essens ☺️🌸";
                const whatsappUrl = `https://wa.me/77007729289?text=${encodeURIComponent(message)}`;
                
                window.open(whatsappUrl, '_blank');
            }
        });
    </script>
</body>
</html>
